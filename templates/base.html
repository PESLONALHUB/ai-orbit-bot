<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Orbit Bot — {% block title %}Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <meta http-equiv="refresh" content="30">
  <style>
    .card { border: 1px solid rgba(255,255,255,.1); }
    .stat-card:hover { transform: translateY(-2px); transition: .2s; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: .85em; }
    .badge-healthy { background: #198754; }
    .badge-degraded { background: #ffc107; color: #000; }
    .badge-disabled { background: #dc3545; }
    .queue-ts { white-space: nowrap; font-size: .8em; color: #888; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/"><i class="bi bi-robot"></i> AI Orbit Bot</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/feeds"><i class="bi bi-rss"></i> Feeds</a></li>
          <li class="nav-item"><a class="nav-link" href="/queue"><i class="bi bi-inbox"></i> Queue</a></li>
          <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-journal-text"></i> Logs</a></li>
          <li class="nav-item"><a class="nav-link" href="/stats"><i class="bi bi-graph-up"></i> Stats</a></li>
        </ul>
        <span class="navbar-text">
          <span class="badge bg-{{ 'success' if status == 'Running' else 'secondary' }}">
            {{ status }}
          </span>
        </span>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
